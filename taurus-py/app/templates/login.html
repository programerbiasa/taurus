<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - {{ app_name or 'TAURUS' }} (Python)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            taurus: {
              navy: '#0f172a',
              gold: '#d4af37',
              goldLight: '#fbbf24',
              goldDark: '#b45309',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-950 to-taurus-navy min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-taurus-gold/30 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Glow effect -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-taurus-gold/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Logo & Name -->
    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex p-3 rounded-2xl bg-slate-800/80 border border-taurus-gold/40 shadow-lg shadow-taurus-gold/20 mb-3">
        {% if app_logo_url %}
          <img src="{{ app_logo_url }}" alt="Logo" class="w-14 h-14 object-contain">
        {% else %}
          <span class="material-symbols-outlined text-4xl text-taurus-goldLight">support_agent</span>
        {% endif %}
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-wider flex items-center justify-center gap-2">
        {{ app_name or 'TAURUS' }}
        <span class="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 uppercase tracking-widest font-bold">PYTHON</span>
      </h1>
      <p class="text-xs font-semibold text-taurus-goldLight mt-1">{{ app_tagline or 'IT SUPPORT & RADIO SYSTEM' }}</p>
    </div>

    <!-- Error Alert -->
    {% if error %}
    <div class="mb-5 p-3.5 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300 text-xs font-medium flex items-center gap-2">
      <span class="material-symbols-outlined text-base text-red-400">error</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="/taurus-py/login" class="space-y-4 relative z-10">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-3 text-slate-400 text-lg">person</span>
          <input type="text" name="username" required placeholder="Masukkan username"
            class="w-full bg-slate-800/80 border border-slate-700 focus:border-taurus-gold rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-taurus-gold transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-3 text-slate-400 text-lg">lock</span>
          <input type="password" name="password" required placeholder="Masukkan password"
            class="w-full bg-slate-800/80 border border-slate-700 focus:border-taurus-gold rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-taurus-gold transition">
        </div>
      </div>

      <button type="submit" class="w-full mt-2 py-3 px-4 bg-gradient-to-r from-amber-600 via-taurus-gold to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-taurus-gold/30 transition transform hover:-translate-y-0.5 active:translate-y-0 text-sm tracking-wide flex items-center justify-center gap-2">
        <span>Masuk ke Sistem</span>
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </button>
    </form>

    <div class="mt-8 text-center border-t border-slate-800 pt-4">
      <p class="text-[11px] text-slate-500">© 2026 TAURUS IT Support • Python Fullstack Edition</p>
    </div>
  </div>
</body>
</html>
